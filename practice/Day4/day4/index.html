<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes Editor</h1>
    <button id="theme-toggle">Dark mode</button>
  </header>

  <main>
    <section>
      <label for="note-text">Write your note:</label>
      <textarea id="note-text" placeholder="Type something here... (Press Escape to clear)"></textarea>
      
      <div class="counters">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="button-group">
        <button id="clear-btn">Clear</button>
      </div>
    </section>
  </main>
</body>
</html>
